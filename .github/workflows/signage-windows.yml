name: Build Windows Signage

on:
  workflow_dispatch:
  push:
    tags: ['signage-v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'signage-v' + require('./apps/signage-desktop/package.json').version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:signage
      - run: pnpm check:signage
      - run: pnpm build
      - run: pnpm signage:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify update artifacts
        shell: pwsh
        run: |
          if (!(Test-Path 'apps/signage-desktop/release/latest.yml')) { throw 'Missing update manifest' }
          if (!(Get-ChildItem 'apps/signage-desktop/release/*.exe.blockmap')) { throw 'Missing update blockmap' }
      - uses: actions/upload-artifact@v4
        with:
          name: kmucs-signage-windows-x64
          path: |
            apps/signage-desktop/release/*.exe
            apps/signage-desktop/release/*.exe.blockmap
            apps/signage-desktop/release/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/signage-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kmucs-signage-windows-x64
          path: release
      - name: Publish installer
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            Windows x64용 KMUCS News Sinage 설치 파일입니다. Assets에서 `.exe` 파일을 내려받아 설치하세요.

            [설치 및 운영 안내](https://github.com/kookmin-sw/newsletter/blob/main/docs/signage/operations.md)

            기사와 편성 변경은 alumni 사이트 배포 후 자동 반영됩니다. 앱 1.3.0부터 설정 창의 앱 업데이트에서 새 버전 확인, 다운로드, 설치·재시작을 할 수 있습니다. 이전 앱은 이번 설치 파일로 한 번 업데이트해야 합니다.

            코드 서명이 없는 설치 파일로 Windows SmartScreen 확인이 표시될 수 있습니다. SHA256SUMS.txt로 다운로드 파일의 해시를 확인할 수 있습니다.
        run: |
          sha256sum -- *.exe *.exe.blockmap latest.yml > SHA256SUMS.txt
          printf '%s\n' "$RELEASE_NOTES" > RELEASE_NOTES.md
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "KMUCS News Sinage ${RELEASE_TAG#signage-v}" \
            --notes-file RELEASE_NOTES.md ./*.exe ./*.exe.blockmap latest.yml SHA256SUMS.txt
