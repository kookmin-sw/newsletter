name: Build Windows Signage

on:
  workflow_dispatch:
  push:
    tags: ['signage-v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:signage
      - run: pnpm check:signage
      - run: pnpm build
      - run: pnpm signage:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kmucs-signage-windows-x64
          path: apps/signage-desktop/release/*.exe
          if-no-files-found: error
